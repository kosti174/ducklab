<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DuckLab Studio</title>
    <!-- EmailJS bibliotheek inladen -->
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
    <style>
        :root {
            --primary: #f3ca13; /* DuckLab Geel */
            --primary-dark: #ccaa0e;
            --bg-light: #f8f9fa;
            --card-bg: #ffffff;
            --text-main: #1a1a1a;
            --text-muted: #6c757d;
            --border-color: #e4e7eb;
        }
        
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
        body { background-color: var(--bg-light); color: var(--text-main); padding-bottom: 60px; }
        
        /* Navigatie zoals de screenshots */
        nav { background-color: #ffffff; padding: 15px 25px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border-color); position: sticky; top: 0; z-index: 100; }
        .logo-container { display: flex; align-items: center; gap: 10px; }
        .logo-text { font-size: 22px; font-weight: 800; color: #000; letter-spacing: -0.5px; text-transform: uppercase; }
        .nav-links { display: flex; gap: 15px; align-items: center; }
        .nav-btn { background: none; border: none; color: var(--text-main); font-size: 20px; cursor: pointer; padding: 8px; border-radius: 5px; position: relative; }
        .nav-btn:hover { color: var(--primary-dark); }
        .cart-badge { position: absolute; top: -2px; right: -2px; background: #000; color: #fff; font-size: 11px; font-weight: bold; width: 18px; height: 18px; border-radius: 50%; display: flex; align-items: center; justify-content: center; }
        .admin-only { display: none; background: #000; color: #fff; font-size: 12px; font-weight: bold; padding: 6px 12px; border-radius: 4px; border: none; cursor: pointer; }

        /* Banner */
        .hero-banner { background: #000; color: #fff; text-align: center; padding: 12px; font-size: 14px; font-weight: 600; letter-spacing: 0.5px; }

        /* Grid lay-out gebaseerd op de screenshots */
        .container { max-width: 1200px; margin: 30px auto; padding: 0 20px; }
        .section-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; border-bottom: 1px solid var(--border-color); padding-bottom: 15px; }
        .section-title { font-size: 28px; font-weight: 700; }
        
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 25px; }
        
        /* Professionele Product Card */
        .product-card { background: var(--card-bg); border-radius: 0px; overflow: hidden; display: flex; flex-direction: column; transition: transform 0.2s; position: relative; }
        .product-card:hover { transform: translateY(-4px); }
        .product-img-wrapper { width: 100%; height: 280px; background: #f0f0f2; overflow: hidden; position: relative; }
        .product-img { width: 100%; height: 100%; object-fit: cover; }
        .product-info { padding: 15px 5px; display: flex; flex-direction: column; flex-grow: 1; }
        .product-title { font-size: 16px; font-weight: 600; margin-bottom: 6px; color: #1a1a1a; line-height: 1.4; text-decoration: none; }
        .product-price { color: #000; font-size: 16px; font-weight: 700; margin-bottom: 15px; }
        
        /* Knoppen in Shopify-stijl */
        .buy-btn { width: 100%; background: #000; color: #fff; border: none; padding: 14px; font-weight: 600; font-size: 14px; border-radius: 4px; cursor: pointer; text-transform: uppercase; letter-spacing: 0.5px; margin-top: auto; transition: background 0.2s; }
        .buy-btn:hover { background: #222; }
        .remove-btn { background: #ff3366; color: white; border: none; padding: 8px; width: 100%; margin-top: 10px; border-radius: 4px; cursor: pointer; font-weight: bold; display: none; }
        
        /* Modals & Cart panel aan de rechterkant */
        .modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); display: flex; align-items: center; justify-content: center; z-index: 1000; }
        .hidden { display: none !important; }
        .modal-content { background: #fff; padding: 30px; border-radius: 8px; width: 100%; max-width: 450px; position: relative; border: 1px solid var(--border-color); }
        .close-btn { position: absolute; top: 15px; right: 20px; font-size: 24px; cursor: pointer; color: var(--text-muted); }
        
        input, select { width: 100%; padding: 14px; background: #fff; border: 1px solid #ccc; color: #000; border-radius: 4px; margin-bottom: 15px; font-size: 15px; }
        .submit-btn { width: 100%; background: #000; color: #fff; border: none; padding: 14px; font-weight: bold; border-radius: 4px; cursor: pointer; text-transform: uppercase; }
        
        /* Settings Selector */
        .settings-select { width: auto; margin-bottom: 0; padding: 6px 10px; font-size: 13px; background: #fff; border: 1px solid var(--border-color); border-radius: 4px; cursor: pointer; }
    </style>
</head>
<body>

    <div class="hero-banner">DESIGN. PRINT. CREATE. — DUCKLAB STUDIO SHOP</div>

    <nav>
        <div class="logo-container">
            <span class="logo-text">🦆 DuckLab Studio</span>
        </div>
        <div class="nav-links">
            <select id="currency-select" class="settings-select" onchange="wisselValuta(this.value)">
                <option value="EUR">EUR €</option>
                <option value="USD">USD $</option>
            </select>
            <button class="nav-btn" onclick="openModal('auth-modal')">👤</button>
            <button class="nav-btn" onclick="openModal('cart-modal')">🛒 <span class="cart-badge" id="cart-count">0</span></button>
            <button class="admin-only" id="admin-upload-btn" onclick="openModal('upload-modal')">➕ Upload Item</button>
            <button class="admin-only" id="admin-orders-btn" onclick="laadBestellingen(); openModal('orders-modal')">✉️ Orders</button>
        </div>
    </nav>

    <div class="container">
        <div class="section-header">
            <h2 class="section-title" id="section-title">Products</h2>
        </div>
        <div class="grid" id="products-grid"></div>
    </div>

    <!-- AUTH MODAL -->
    <div id="auth-modal" class="modal hidden">
        <div class="modal-content">
            <span class="close-btn" onclick="closeModal('auth-modal')">&times;</span>
            <h2>Inloggen</h2>
            <input type="email" id="email" placeholder="Je e-mailadres" required>
            <button class="submit-btn" id="btn-send-code" onclick="stuurLoginCode()">Stuur Verificatie Code</button>
            <div style="margin-top: 25px; border-top: 1px solid var(--border-color); padding-top: 20px;">
                <input type="text" id="logincode" placeholder="Voer code in">
                <button class="submit-btn" id="btn-verify-code" style="background: var(--primary); color: black;" onclick="verifieerCode()">Verifieer & Log in</button>
            </div>
        </div>
    </div>

    <!-- UPLOAD MODAL -->
    <div id="upload-modal" class="modal hidden">
        <div class="modal-content">
            <span class="close-btn" onclick="closeModal('upload-modal')">&times;</span>
            <h2>Nieuw Item Toevoegen</h2>
            <input type="text" id="prod-naam" placeholder="Productnaam">
            <input type="number" id="prod-prijs" placeholder="Prijs (in EUR €)" step="0.01">
            <input type="text" id="prod-foto" placeholder="Link naar productafbeelding (URL)">
            <button class="submit-btn" style="background: var(--primary); color: black;" onclick="uploadProduct()">Live zetten</button>
        </div>
    </div>

    <!-- ORDERS MODAL -->
    <div id="orders-modal" class="modal hidden">
        <div class="modal-content" style="max-width: 600px;">
            <span class="close-btn" onclick="closeModal('orders-modal')">&times;</span>
            <h2>Binnengekomen Bestellingen</h2>
            <div id="bestellingen-lijst" style="margin-top: 20px; max-height: 400px; overflow-y: auto;"></div>
        </div>
    </div>

    <!-- WINKELWAGEN MODAL -->
    <div id="cart-modal" class="modal hidden">
        <div class="modal-content">
            <span class="close-btn" onclick="closeModal('cart-modal')">&times;</span>
            <h2>Afrekenen (Payconiq)</h2>
            <div id="cart-checkout-details" style="margin-bottom: 15px; font-weight: bold;"></div>
            <input type="text" id="klant-naam" placeholder="Volledige Naam">
            <input type="text" id="klant-postcode" placeholder="Postcode">
            <input type="text" id="klant-adres" placeholder="Straatnaam + Huisnummer">
            <button class="submit-btn" id="btn-place-order" style="background: #10b981; color: white;" onclick="startPayconiq()">Bestellen & Betalen</button>
        </div>
    </div>

    <script>
        const EMAILJS_PUBLIC_KEY = "nX-Rp_DkBYlLtAX-I"; 
        const EMAILJS_TEMPLATE_ID = "template_osvg32m";
        const EMAILJS_SERVICE_ID = "service_cb995gq"; 
        const PAYCONIQ_ONTVANGER = "kostasnikora@gmail.com"; 

        emailjs.init(EMAILJS_PUBLIC_KEY);

        let isAdmin = false;
        let gegenereerdeCode = null;
        let geselecteerdProduct = null;
        let huidigeValuta = "EUR";
        const EUR_NAAR_USD_KOERS = 1.09;

        // Dit zijn de standaard items die ALTIJD voor iedereen zichtbaar zijn (zoals op je screenshots!)
        const STANDAARD_PRODUCTEN = [
            { id: 1, naam: "10 Piece Mystery Fidget Box | 3D Printed Fidget Toy Set", prijs: 20.00, fotoUrl: "https://placehold.co/600x600/f0f0f2/000000?text=10+Piece+Fidget+Box" },
            { id: 2, naam: "25 Piece Mystery Fidget Box | 3D Printed Sensory Bundle", prijs: 50.00, fotoUrl: "https://placehold.co/600x600/f0f0f2/000000?text=25+Piece+Mystery+Box" },
            { id: 3, naam: "Personalized Baseball Gear Holder | Custom Fence Clip", prijs: 35.00, fotoUrl: "https://placehold.co/600x600/f0f0f2/000000?text=Baseball+Holder" }
        ];

        window.onload = function() {
            if (!localStorage.getItem('ducklab_products')) {
                localStorage.setItem('ducklab_products', JSON.stringify(STANDAARD_PRODUCTEN));
            }
            laadProducten();
        };

        function openModal(id) { document.getElementById(id).classList.remove('hidden'); }
        function closeModal(id) { document.getElementById(id).classList.add('hidden'); }

        function openCartVoorProduct(id, naam, prijs) {
            geselecteerdProduct = { id: id, naam: naam, prijs: prijs };
            document.getElementById('cart-checkout-details').innerText = `${naam} — ${formatteerPrijs(prijs)}`;
            document.getElementById('cart-count').innerText = "1";
            openModal('cart-modal');
        }

        function wisselValuta(valuta) {
            huidigeValuta = valuta;
            laadProducten();
        }

        function formatteerPrijs(prijsInEur) {
            if (huidigeValuta === "USD") {
                return `$ ${(prijsInEur * EUR_NAAR_USD_KOERS).toFixed(2)} USD`;
            } else {
                return `€ ${parseFloat(prijsInEur).toFixed(2)} EUR`;
            }
        }

        function laadProducten() {
            let producten = JSON.parse(localStorage.getItem('ducklab_products')) || STANDAARD_PRODUCTEN;
            let grid = document.getElementById('products-grid');
            grid.innerHTML = '';
            
            producten.forEach(p => {
                let card = document.createElement('div');
                card.className = 'product-card';
                let foto = p.fotoUrl || "https://placehold.co/600x600/f0f0f2/000000?text=DuckLab+Studio";

                card.innerHTML = `
                    <div class="product-img-wrapper">
                        <img src="${foto}" class="product-img" alt="${p.naam}">
                    </div>
                    <div class="product-info">
                        <div class="product-title">${p.naam}</div>
                        <div class="product-price">${formatteerPrijs(p.prijs)}</div>
                        <button class="buy-btn" onclick="openCartVoorProduct(${p.id}, '${p.naam}', ${p.prijs})">Add to cart</button>
                        <button class="remove-btn" id="del-${p.id}" onclick="verwijderProduct(${p.id})">❌ Verwijderen</button>
                    </div>
                `;
                grid.appendChild(card);
                if(isAdmin) document.getElementById(`del-${p.id}`).style.display = 'block';
            });
        }

        function stuurLoginCode() {
            let emailadres = document.getElementById('email').value.trim();
            let btn = document.getElementById('btn-send-code');
            if(!emailadres.includes('@')) return;

            gegenereerdeCode = Math.floor(100000 + Math.random() * 900000).toString();

            let templateParams = {
                to_email: emailadres, 
                email: emailadres,
                code: gegenereerdeCode
            };

            btn.innerText = "⏳ Verzenden...";
            btn.disabled = true;

            emailjs.send(EMAILJS_SERVICE_ID, EMAILJS_TEMPLATE_ID, templateParams)
                .then(function() {
                    btn.innerText = "✅ Code verzonden!";
                }, function(error) {
                    btn.innerText = "❌ Fout!";
                    console.error(error);
                });
        }

        function verifieerCode() {
            let email = document.getElementById('email').value;
            let ingevoerdeCode = document.getElementById('logincode').value;

            if(ingevoerdeCode === gegenereerdeCode) {
                if(email.toLowerCase() === "kostasnikora@gmail.com") {
                    isAdmin = true;
                    alert("Welkom terug, Admin Kostas!");
                    document.getElementById('admin-upload-btn').style.display = 'inline-block';
                    document.getElementById('admin-orders-btn').style.display = 'inline-block';
                    laadProducten();
                } else {
                    alert("Succesvol ingelogd!");
                }
                closeModal('auth-modal');
            } else {
                alert("Onjuiste code!");
            }
        }

        function uploadProduct() {
            let naam = document.getElementById('prod-naam').value;
            let prijs = document.getElementById('prod-prijs').value;
            let fotoUrl = document.getElementById('prod-foto').value;
            if(!naam || !prijs) return;

            let producten = JSON.parse(localStorage.getItem('ducklab_products')) || STANDAARD_PRODUCTEN;
            producten.push({ id: Date.now(), naam: naam, prijs: parseFloat(prijs), fotoUrl: fotoUrl });
            localStorage.setItem('ducklab_products', JSON.stringify(producten));

            laadProducten();
            closeModal('upload-modal');
        }

        function verwijderProduct(id) {
            let producten = JSON.parse(localStorage.getItem('ducklab_products')) || STANDAARD_PRODUCTEN;
            producten = producten.filter(p => p.id !== id);
            localStorage.setItem('ducklab_products', JSON.stringify(producten));
            laadProducten();
        }

        function startPayconiq() {
            let naam = document.getElementById('klant-naam').value;
            let postcode = document.getElementById('klant-postcode').value;
            let adres = document.getElementById('klant-adres').value;
            if(!naam || !postcode || !adres) return alert("Vul alles in!");

            let bestellingen = JSON.parse(localStorage.getItem('ducklab_orders')) || [];
            bestellingen.push({ id: Date.now(), klantNaam: naam, postcode: postcode, adres: adres, product: geselecteerdProduct.naam, prijs: geselecteerdProduct.prijs, status: "Awaiting Payment" });
            localStorage.setItem('ducklab_orders', JSON.stringify(bestellingen));

            let betaalUrl = `https://api.qrserver.com/v1/create-qr-code/?size=300x300&data=https://www.payconiq.com/pay?amount=${geselecteerdProduct.prijs.toFixed(2)}%26receiver=${encodeURIComponent(PAYCONIQ_ONTVANGER)}`;
            window.open(betaalUrl, '_blank');
            closeModal('cart-modal');
        }

        function laadBestellingen() {
            let bestellingen = JSON.parse(localStorage.getItem('ducklab_orders')) || [];
            let lijst = document.getElementById('bestellingen-lijst');
            lijst.innerHTML = bestellingen.length === 0 ? '<p>Geen bestellingen gevonden.</p>' : '';
            
            bestellingen.forEach(b => {
                lijst.innerHTML += `<div style="background:#f0f0f2; padding:10px; margin-bottom:10px; border-radius:4px;">
                    <b>Klant:</b> ${b.klantNaam}<br><b>Adres:</b> ${b.adres}<br><b>Item:</b> ${b.product}<br><b>Status:</b> ${b.status}
                </div>`;
            });
        }
    </script>
</body>
</html>
