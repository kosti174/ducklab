<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Print Forge & Admin</title>
    <style>
        :root {
            --primary: #00ffaa;
            --bg-dark: #121214;
            --card-bg: #1a1a1e;
            --text-main: #ffffff;
            --text-muted: #a0a0a5;
            --accent: #ff3366;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; }
        body { background-color: var(--bg-dark); color: var(--text-main); padding-bottom: 60px; }
        nav { background-color: var(--card-bg); padding: 15px 30px; display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #2a2a30; position: sticky; top: 0; z-index: 100; }
        .logo { font-size: 24px; font-weight: bold; color: var(--primary); text-transform: uppercase; }
        .nav-links { display: flex; gap: 20px; align-items: center; }
        .nav-btn { background: none; border: none; color: var(--text-main); font-size: 16px; cursor: pointer; padding: 8px 16px; border-radius: 6px; }
        .nav-btn:hover { color: var(--primary); }
        .admin-only { display: none; border: 1px dashed var(--accent); color: var(--accent); }
        .container { max-width: 1200px; margin: 40px auto; padding: 0 20px; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 30px; margin-top: 20px; }
        
        /* Product kaart aangepast voor échte afbeeldingen */
        .product-card { background: var(--card-bg); border-radius: 12px; overflow: hidden; border: 1px solid #2a2a30; display: flex; flex-direction: column; }
        .product-img { width: 100%; height: 220px; object-fit: cover; background: #252529; }
        .product-info { padding: 20px; display: flex; flex-direction: column; flex-grow: 1; }
        .product-title { font-size: 18px; margin-bottom: 8px; }
        .product-price { color: var(--primary); font-size: 20px; font-weight: bold; margin-bottom: 15px; }
        .buy-btn { width: 100%; background: var(--primary); color: #000; border: none; padding: 12px; font-weight: bold; border-radius: 6px; cursor: pointer; margin-top: auto; }
        .remove-btn { background: var(--accent); color: white; border: none; padding: 8px; width: 100%; margin-top: 10px; border-radius: 6px; cursor: pointer; font-weight: bold; display: none; }
        
        .modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); display: flex; align-items: center; justify-content: center; z-index: 1000; }
        .hidden { display: none !important; }
        .modal-content { background: var(--card-bg); padding: 40px; border-radius: 16px; width: 100%; max-width: 450px; border: 1px solid #3a3a42; position: relative; }
        .close-btn { position: absolute; top: 15px; right: 20px; font-size: 24px; cursor: pointer; color: var(--text-muted); }
        input { width: 100%; padding: 14px; background: #252529; border: 1px solid #3a3a42; color: white; border-radius: 8px; margin-bottom: 15px; }
        .submit-btn { width: 100%; background: #007bff; color: white; border: none; padding: 14px; font-weight: bold; border-radius: 8px; cursor: pointer; }
        .order-item { background: #252529; padding: 15px; border-radius: 8px; margin-bottom: 10px; border-left: 4px solid var(--primary); }
    </style>
</head>
<body>

    <nav>
        <div class="logo">DuckLab Studio</div>
        <div class="nav-links">
            <button class="nav-btn" id="login-nav-btn" onclick="openModal('auth-modal')">👤 Inloggen</button>
            <button class="nav-btn" onclick="openModal('cart-modal')">🛒 Winkelwagen</button>
            <button class="nav-btn admin-only" id="admin-upload-btn" onclick="openModal('upload-modal')">➕ [Admin] Upload</button>
            <button class="nav-btn admin-only" id="admin-orders-btn" onclick="laadBestellingen(); openModal('orders-modal')">✉️ [Admin] Bestellingen</button>
        </div>
    </nav>

    <div class="container">
        <h2>Beschikbare 3D Prints</h2>
        <div class="grid" id="products-grid"></div>
    </div>

    <!-- AUTH MODAL -->
    <div id="auth-modal" class="modal hidden">
        <div class="modal-content">
            <span class="close-btn" onclick="closeModal('auth-modal')">&times;</span>
            <h2>Inloggen</h2>
            <input type="email" id="email" placeholder="Je e-mailadres" required>
            <button class="submit-btn" onclick="stuurLoginCode()">Send Verificatie Code</button>
            <div style="margin-top: 25px; border-top: 1px solid #3a3a42; padding-top: 20px;">
                <input type="text" id="logincode" placeholder="Voer code in">
                <button class="submit-btn" style="background: var(--primary); color: black;" onclick="verifieerCode()">Verifieer & Log in</button>
            </div>
        </div>
    </div>

    <!-- UPLOAD MODAL -->
    <div id="upload-modal" class="modal hidden">
        <div class="modal-content">
            <span class="close-btn" onclick="closeModal('upload-modal')">&times;</span>
            <h2>Nieuw Item Live Zetten</h2>
            <input type="text" id="prod-naam" placeholder="Productnaam">
            <input type="number" id="prod-prijs" placeholder="Prijs (€)" step="0.01">
            <input type="text" id="prod-foto" placeholder="Link naar afbeelding (URL)">
            <button class="submit-btn" style="background: var(--primary); color: black;" onclick="uploadProduct()">Opslaan in Database</button>
        </div>
    </div>

    <!-- ORDERS MODAL -->
    <div id="orders-modal" class="modal hidden">
        <div class="modal-content" style="max-width: 600px;">
            <span class="close-btn" onclick="closeModal('orders-modal')">&times;</span>
            <h2>Bestellingen uit Database</h2>
            <div id="bestellingen-lijst"></div>
        </div>
    </div>

    <!-- WINKELWAGEN -->
    <div id="cart-modal" class="modal hidden">
        <div class="modal-content">
            <span class="close-btn" onclick="closeModal('cart-modal')">&times;</span>
            <h2>Afrekenen via Payconiq</h2>
            <input type="text" id="klant-naam" placeholder="Volledige Naam">
            <input type="text" id="klant-postcode" placeholder="Postcode">
            <input type="text" id="klant-adres" placeholder="Straatnaam + Huisnummer">
            <button class="submit-btn" style="background: #00ea1e; color: black;" onclick="startPayconiq()">Plaats Bestelling</button>
        </div>
    </div>

    <script>
        let isAdmin = false;
        const backendUrl = "http://localhost:8080/api";

        window.onload = laadProducten;

        function openModal(id) { document.getElementById(id).classList.remove('hidden'); }
        function closeModal(id) { document.getElementById(id).classList.add('hidden'); }

        // 1. HAAL PRODUCTEN OP (Inclusief afbeeldingen!)
        function laadProducten() {
            fetch(`${backendUrl}/products`)
                .then(res => res.json())
                .then(data => {
                    let grid = document.getElementById('products-grid');
                    grid.innerHTML = data.length === 0 ? '<p>Geen producten in database.</p>' : '';
                    data.forEach(p => {
                        let card = document.createElement('div');
                        card.className = 'product-card';
                        
                        // Checken of er een afbeelding is meegegeven, anders fallback tekst
                        let imageHtml = p.fotoUrl ? `<img src="${p.fotoUrl}" class="product-img" alt="${p.naam}">` : `<div class="product-img" style="display:flex; align-items:center; justify-content:center; color:var(--text-muted);">[ Geen Foto ]</div>`;

                        card.innerHTML = `
                            ${imageHtml}
                            <div class="product-info">
                                <div class="product-title"><b>${p.naam}</b></div>
                                <div class="product-price">€ ${p.prijs.toFixed(2)}</div>
                                <button class="buy-btn" onclick="openModal('cart-modal')">In Winkelwagen</button>
                                <button class="remove-btn" id="del-${p.id}" onclick="verwijderProduct(${p.id})">❌ Verwijder uit DB</button>
                            </div>
                        `;
                        grid.appendChild(card);
                        if(isAdmin) document.getElementById(`del-${p.id}`).style.display = 'block';
                    });
                }).catch(() => {
                    document.getElementById('products-grid').innerHTML = '<p>Backend offline (Simulatiemodus actief).</p>';
                });
        }

        // 2. EMAIL EN LOGIN
        function stuurLoginCode() {
            let email = document.getElementById('email').value;
            fetch(`${backendUrl}/auth/code?email=${email}`, { method: 'POST' })
                .then(res => alert('Code is verstuurd! Check je mailbox.'))
                .catch(() => alert('Backend offline. Gebruik code 123456 voor simulatie.'));
        }

        function verifieerCode() {
            let email = document.getElementById('email').value;
            let code = document.getElementById('logincode').value;

            if(email.toLowerCase() === "kostasnikora@gmail.com" && (code === "123456" || code)) {
                isAdmin = true;
                alert('Welkom terug, Admin Kostas!');
                document.getElementById('admin-upload-btn').style.display = 'flex';
                document.getElementById('admin-orders-btn').style.display = 'flex';
                document.getElementById('login-nav-btn').innerText = '👤 Admin';
                laadProducten();
            } else {
                alert('Ingelogd als klant.');
            }
            closeModal('auth-modal');
        }

        // 3. PRODUCT EN FOTO LINK OPSLAAN IN DB
        function uploadProduct() {
            let naam = document.getElementById('prod-naam').value;
            let prijs = document.getElementById('prod-prijs').value;
            let fotoUrl = document.getElementById('prod-foto').value;

            fetch(`${backendUrl}/admin/upload?naam=${naam}&prijs=${prijs}&fotoUrl=${fotoUrl}`, { method: 'POST' })
                .then(() => {
                    alert('Succesvol opgeslagen in DB!');
                    laadProducten();
                    closeModal('upload-modal');
                    // Reset inputs
                    document.getElementById('prod-naam').value = '';
                    document.getElementById('prod-prijs').value = '';
                    document.getElementById('prod-foto').value = '';
                });
        }

        // 4. REMOVE
        function verwijderProduct(id) {
            if(!confirm("Weet je zeker dat je dit product uit de database wilt wissen?")) return;
            
            fetch(`${backendUrl}/admin/product/${id}`, { method: 'DELETE' })
                .then(() => {
                    alert('Product is gewist!');
                    laadProducten();
                });
        }

        // 5. BESTELLINGEN
        function startPayconiq() {
            let naam = document.getElementById('klant-naam').value;
            let postcode = document.getElementById('klant-postcode').value;
            let adres = document.getElementById('klant-adres').value;

            fetch(`${backendUrl}/checkout/payconiq?naam=${naam}&postcode=${postcode}&adres=${adres}`, { method: 'POST' })
                .then(() => {
                    alert('Bestelling opgeslagen!');
                    closeModal('cart-modal');
                });
        }

        function laadBestellingen() {
            let email = document.getElementById('email').value;
            fetch(`${backendUrl}/admin/bestellingen?email=${email}`)
                .then(res => res.json())
                .then(data => {
                    let lijst = document.getElementById('bestellingen-lijst');
                    lijst.innerHTML = data.length === 0 ? '<p>Geen bestellingen gevonden.</p>' : '';
                    data.forEach(b => {
                        lijst.innerHTML += `<div class="order-item"><b>Klant:</b> ${b.klantNaam}<br><b>Adres:</b> ${b.adres}, ${b.postcode}<br><b>Status:</b> ${b.status}</div>`;
                    });
                });
        }
    </script>
</body>
</html>
