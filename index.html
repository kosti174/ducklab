<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DuckLab Studio</title>
    <style>
        :root {
            --primary: #f3ca13; /* DuckLab Yellow */
            --bg-light: #f8f9fa;
            --card-bg: #ffffff;
            --text-main: #1a1a1a;
            --border-color: #e4e7eb;
        }
        
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, sans-serif; }
        body { background-color: var(--bg-light); color: var(--text-main); padding-bottom: 60px; }
        
        nav { background-color: var(--primary); padding: 15px 25px; display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #000; position: sticky; top: 0; z-index: 100; }
        .logo-text { font-size: 22px; font-weight: 800; color: #000; text-transform: uppercase; }
        .nav-links { display: flex; gap: 15px; align-items: center; }
        .nav-btn { background: none; border: none; font-size: 20px; cursor: pointer; position: relative; }
        .cart-badge { position: absolute; top: -2px; right: -2px; background: #000; color: #fff; font-size: 11px; font-weight: bold; width: 18px; height: 18px; border-radius: 50%; display: flex; align-items: center; justify-content: center; }
        
        .admin-only { display: none; background: #000; color: #fff; font-size: 12px; font-weight: bold; padding: 8px 14px; border-radius: 4px; border: none; cursor: pointer; text-transform: uppercase; }
        .admin-badge { display: none; background: #ef4444; color: white; padding: 4px 8px; font-size: 11px; font-weight: bold; border-radius: 3px; margin-left: 10px; }

        .container { max-width: 1200px; margin: 30px auto; padding: 0 20px; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 25px; }
        
        .product-card { background: var(--card-bg); border: 1px solid var(--border-color); display: flex; flex-direction: column; }
        .product-img-wrapper { width: 100%; height: 280px; background: #f0f0f2; }
        .product-img { width: 100%; height: 100%; object-fit: cover; }
        .product-info { padding: 15px; display: flex; flex-direction: column; flex-grow: 1; }
        .product-title { font-size: 16px; font-weight: 600; margin-bottom: 6px; }
        .product-price { font-weight: 700; margin-bottom: 15px; }
        
        .buy-btn { width: 100%; background: #000; color: #fff; border: none; padding: 14px; font-weight: 600; cursor: pointer; text-transform: uppercase; }
        .buy-btn:hover { background: var(--primary); color: #000; }
        
        .modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); display: flex; align-items: center; justify-content: center; z-index: 1000; }
        .hidden { display: none !important; }
        .modal-content { background: #fff; padding: 30px; border-radius: 8px; width: 100%; max-width: 450px; position: relative; }
        .close-btn { position: absolute; top: 15px; right: 20px; font-size: 24px; cursor: pointer; }
        
        input { width: 100%; padding: 14px; border: 1px solid #ccc; border-radius: 4px; margin-bottom: 15px; }
        .submit-btn { width: 100%; background: #ff3366; color: #fff; border: none; padding: 14px; font-weight: bold; border-radius: 4px; cursor: pointer; text-transform: uppercase; }
        
        .status-badge { display: inline-block; padding: 4px 8px; font-size: 12px; font-weight: bold; border-radius: 4px; }
        .status-paid { background: #d1fae5; color: #065f46; }
        .status-waiting { background: #fef3c7; color: #d97706; }
    </style>
</head>
<body>

    <nav>
        <div class="logo-container">
            <span class="logo-text">🦆 DuckLab Studio</span>
            <span class="admin-badge" id="admin-indicator">Admin Mode</span>
        </div>
        <div class="nav-links">
            <button class="nav-btn" onclick="openModal('cart-modal'); renderCartUI();">🛒 <span class="cart-badge" id="cart-count">0</span></button>
            <button class="admin-only" id="admin-orders-btn" onclick="loadOrders(); openModal('orders-modal')">✉️ Orders</button>
            <button class="admin-only" id="admin-logout-btn" onclick="logoutAdmin()" style="background:#ef4444;">Exit Admin</button>
        </div>
    </nav>

    <div class="container">
        <div class="grid" id="products-grid"></div>
    </div>

    <!-- ORDERS MODAL (ADMIN) -->
    <div id="orders-modal" class="modal hidden">
        <div class="modal-content" style="max-width: 600px;">
            <span class="close-btn" onclick="closeModal('orders-modal')">&times;</span>
            <h2>Incoming Orders Database</h2>
            <div id="bestellingen-lijst" style="margin-top: 20px; max-height: 400px; overflow-y: auto;"></div>
        </div>
    </div>

    <!-- SHOPPING CART MODAL -->
    <div id="cart-modal" class="modal hidden">
        <div class="modal-content" id="cart-modal-body"></div>
    </div>

    <script>
        // Change this to your official Payconiq Merchant ID or Payconiq link details
        const PAYCONIQ_MERCHANT_ID = "YOUR_PAYCONIQ_ID"; 

        let isAdmin = false;
        let winkelwagen = [];

        const STANDAARD_PRODUCTEN = [
            { id: 1, naam: "10 Piece Mystery Fidget Box", prijs: 20.00, fotoUrl: "https://placehold.co/600x600?text=10+Piece+Fidget" },
            { id: 2, naam: "25 Piece Mystery Fidget Box", prijs: 50.00, fotoUrl: "https://placehold.co/600x600?text=25+Piece+Fidget" }
        ];

        window.onload = function() {
            if (!localStorage.getItem('ducklab_products')) {
                localStorage.setItem('ducklab_products', JSON.stringify(STANDAARD_PRODUCTEN));
            }
            checkAdminStatus();
            checkPayconiqCallback(); 
            loadProducts();
            updateCartCountUI();
        };

        function checkAdminStatus() {
            const urlParams = new URLSearchParams(window.location.search);
            if (urlParams.get('admin') === 'true') {
                localStorage.setItem('ducklab_admin_active', 'yes');
                isAdmin = true;
                window.history.replaceState({}, document.title, window.location.pathname);
            } else if (localStorage.getItem('ducklab_admin_active') === 'yes') {
                isAdmin = true;
            }
            if (isAdmin) {
                document.getElementById('admin-indicator').style.display = 'inline-block';
                document.getElementById('admin-orders-btn').style.display = 'inline-block';
                document.getElementById('admin-logout-btn').style.display = 'inline-block';
            }
        }

        // ================= PURE PAYCONIQ GENERATOR & FIXES =================
        function startPayconiqCheckout() {
            let naam = document.getElementById('klant-naam').value;
            let postcode = document.getElementById('klant-postcode').value;
            let adres = document.getElementById('klant-adres').value;
            
            if(!naam || !postcode || !adres) return alert("Please fill out all your shipping information!");

            let totaalPrijs = winkelwagen.reduce((totaal, item) => totaal + (item.prijs * item.aantal), 0);
            let itemsOmschrijving = winkelwagen.map(item => `${item.aantal}x ${item.naam}`).join(', ');
            
            let orderId = "PQ-" + Math.floor(100000 + Math.random() * 900000); 

            // FIX 1: Save order to LocalStorage IMMEDIATELY so you see it instantly in Admin Panel
            let bestellingen = JSON.parse(localStorage.getItem('ducklab_orders')) || [];
            bestellingen.push({ 
                id: orderId, klantNaam: naam, postcode: postcode, adres: adres, product: itemsOmschrijving, prijs: totaalPrijs, status: "Awaiting Payconiq Payment" 
            });
            localStorage.setItem('ducklab_orders', JSON.stringify(bestellingen));

            // FIX 2: Generate direct Payconiq API string format into a functional QR code image
            let payconiqData = `https://payconiq.com/pay?m=${PAYCONIQ_MERCHANT_ID}&a=${totaalPrijs.toFixed(2)}&r=${orderId}`;
            let qrCodeUrl = `https://api.qrserver.com/v1/create-qr-code/?size=250x250&data=${encodeURIComponent(payconiqData)}`;

            // Display the interactive Payconiq payment screen
            let modalBody = document.getElementById('cart-modal-body');
            modalBody.innerHTML = `
                <span class="close-btn" onclick="closeModal('cart-modal')">&times;</span>
                <div style="text-align:center; padding:10px;">
                    <h2 style="color:#ff3366; margin-bottom:15px;">📱 Scan with Payconiq</h2>
                    <img src="${qrCodeUrl}" alt="Payconiq QR Code" style="border: 3px solid #000; padding:10px; margin-bottom:15px; width:220px; height:220px;">
                    <p style="font-size:14px; margin-bottom:15px;"><b>Order ID:</b> ${orderId}<br><b>Total Amount:</b> € ${totaalPrijs.toFixed(2)}</p>
                    <p style="font-size:12px; color:#555; margin-bottom:15px;">Open your Payconiq app, scan, and confirm.</p>
                    <button class="submit-btn" style="background:#000;" onclick="confirmPaymentSimulation('${orderId}')">I Have Paid (Confirm)</button>
                </div>
            `;
        }

        // Simulates payment verification since GitHub Pages can't automatically receive external bank webhooks
        function confirmPaymentSimulation(orderId) {
            let returnUrl = window.location.href.split('?')[0] + `?payconiq_status=success&order_id=${orderId}`;
            window.location.href = returnUrl;
        }

        function checkPayconiqCallback() {
            const urlParams = new URLSearchParams(window.location.search);
            if (urlParams.get('payconiq_status') === 'success' && urlParams.get('order_id')) {
                let gelukteOrderID = urlParams.get('order_id');
                
                let bestellingen = JSON.parse(localStorage.getItem('ducklab_orders')) || [];
                let order = bestellingen.find(b => b.id === gelukteOrderID);
                
                if (order && order.status !== "Payconiq Paid! ✅") {
                    order.status = "Payconiq Paid! ✅";
                    localStorage.setItem('ducklab_orders', JSON.stringify(bestellingen));
                    
                    alert("🎉 Thank you! Your Payconiq payment was registered. The order is now active.");
                    winkelwagen = [];
                    updateCartCountUI();
                }
                window.history.replaceState({}, document.title, window.location.pathname);
            }
        }
        // ===================================================================

        function openModal(id) { document.getElementById(id).classList.remove('hidden'); }
        function closeModal(id) { document.getElementById(id).classList.add('hidden'); }

        function addToCart(id, naam, prijs) {
            let bestaandItem = winkelwagen.find(item => item.id === id);
            if (bestaandItem) { bestaandItem.aantal += 1; } else { winkelwagen.push({ id: id, naam: naam, prijs: prijs, aantal: 1 }); }
            updateCartCountUI();
        }

        function updateCartCountUI() {
            document.getElementById('cart-count').innerText = winkelwagen.reduce((t, i) => t + i.aantal, 0);
        }

        function renderCartUI() {
            let modalBody = document.getElementById('cart-modal-body');
            if (winkelwagen.length === 0) {
                modalBody.innerHTML = `<span class="close-btn" onclick="closeModal('cart-modal')">&times;</span><h2>Your cart is empty</h2>`;
                return;
            }
            let totaal = winkelwagen.reduce((t, i) => t + (i.prijs * i.aantal), 0);
            modalBody.innerHTML = `
                <span class="close-btn" onclick="closeModal('cart-modal')">&times;</span>
                <h2>Shopping Cart</h2>
                <div style="margin: 15px 0; font-weight: bold;">Total: € ${totaal.toFixed(2)}</div>
                <input type="text" id="klant-naam" placeholder="Full Name">
                <input type="text" id="klant-postcode" placeholder="Postal Code">
                <input type="text" id="klant-adres" placeholder="Street + House Number">
                <button class="submit-btn" onclick="startPayconiqCheckout()">📱 Pay with Payconiq</button>
            `;
        }

        function loadProducts() {
            let producten = JSON.parse(localStorage.getItem('ducklab_products')) || STANDAARD_PRODUCTEN;
            let grid = document.getElementById('products-grid');
            grid.innerHTML = '';
            producten.forEach(p => {
                grid.innerHTML += `
                    <div class="product-card">
                        <div class="product-img-wrapper"><img src="${p.fotoUrl}" class="product-img"></div>
                        <div class="product-info">
                            <div class="product-title">${p.naam}</div>
                            <div class="product-price">€ ${p.prijs.toFixed(2)}</div>
                            <button class="buy-btn" onclick="addToCart(${p.id}, '${p.naam}', ${p.prijs})">Add to cart</button>
                        </div>
                    </div>`;
            });
        }

        function loadOrders() {
            let bestellingen = JSON.parse(localStorage.getItem('ducklab_orders')) || [];
            let lijst = document.getElementById('bestellingen-lijst');
            lijst.innerHTML = bestellingen.length === 0 ? '<p>No orders found.</p>' : '';
            bestellingen.forEach(b => {
                let statusClass = b.status.includes("✅") ? "status-paid" : "status-waiting";
                lijst.innerHTML += `
                <div style="background:#f0f0f2; padding:15px; margin-bottom:12px; border-radius:6px; font-size:14px; color:#000;">
                    <b>Order ID:</b> ${b.id}<br>
                    <b>Client Name:</b> ${b.klantNaam}<br>
                    <b>Items Ordered:</b> ${b.product}<br>
                    <b>Total Price:</b> € ${parseFloat(b.prijs).toFixed(2)}<br>
                    <b>Status:</b> <span class="status-badge ${statusClass}">${b.status}</span>
                </div>`;
            });
        }

        function logoutAdmin() { localStorage.removeItem('ducklab_admin_active'); location.reload(); }
    </script>
</body>
</html>
